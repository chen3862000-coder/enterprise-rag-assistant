name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify tests, architecture, static analysis, and coverage
        run: ./mvnw -B verify
        working-directory: backend

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start Compose services for E2E
        run: docker compose up --detach --wait postgres ollama backend frontend
      - name: Run browser end-to-end tests against Compose
        run: npm run test:e2e
        working-directory: frontend
        env:
          E2E_COMPOSE_MANAGED: 'true'
      - name: Stop Compose services after E2E
        if: always()
        run: docker compose down

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build application images
        run: docker compose build backend frontend
      - name: Verify Compose services start healthy
        run: docker compose up --detach --wait postgres ollama backend frontend
      - name: Stop Compose services without removing data
        if: always()
        run: docker compose down
