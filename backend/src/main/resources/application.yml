spring:
  application:
    name: enterprise-rag-assistant
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/enterprise_rag}
    username: ${DATABASE_USERNAME:enterprise_rag}
    password: ${DATABASE_PASSWORD:enterprise_rag}
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${MAXIMUM_UPLOAD_BYTES:50MB}
      max-request-size: ${MAXIMUM_UPLOAD_BYTES:50MB}
  ai:
    model:
      chat: ${CHAT_MODEL_PROVIDER:none}
      embedding: ollama
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        model: ${DEEPSEEK_MODEL:deepseek-chat}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        model: ${EMBEDDING_MODEL:nomic-embed-text}
        truncate: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict

app:
  traces:
    retention-days: ${TRACE_RETENTION_DAYS:30}
    cleanup-cron: ${TRACE_CLEANUP_CRON:0 17 3 * * *}
  evaluation:
    prefix-shadow-enabled: ${EVALUATION_PREFIX_SHADOW_ENABLED:false}
  demo:
    authentication-enabled: ${DEMO_AUTHENTICATION_ENABLED:true}
  retrieval:
    candidate-depth: 160
    fused-depth: 32
    rrf-constant: 60
    minimum-vector-similarity: ${MINIMUM_VECTOR_SIMILARITY:0.35}
    minimum-keyword-score: ${MINIMUM_KEYWORD_SCORE:0.3}
    max-context-characters: 12000
  query-planner:
    enabled: ${QUERY_PLANNER_ENABLED:true}
    provider: ${QUERY_PLANNER_PROVIDER:deepseek}
    model: ${QUERY_PLANNER_MODEL:${DEEPSEEK_MODEL:deepseek-chat}}
    timeout-ms: ${QUERY_PLANNER_TIMEOUT_MS:5000}
    max-lexical-queries: ${QUERY_PLANNER_MAX_LEXICAL_QUERIES:4}
    max-alternative-queries: ${QUERY_PLANNER_MAX_ALTERNATIVE_QUERIES:3}
  ingestion:
    max-file-bytes: ${MAXIMUM_UPLOAD_BYTES:52428800}
    source-dir: ${INGESTION_SOURCE_DIR:${java.io.tmpdir}/enterprise-rag-ingestion}
    worker-enabled: ${INGESTION_WORKER_ENABLED:true}
    worker-poll-ms: ${INGESTION_WORKER_POLL_MS:2000}
    worker-concurrency: ${INGESTION_WORKER_CONCURRENCY:2}
    batch-size: ${INGESTION_BATCH_SIZE:32}
    max-attempts: ${INGESTION_MAX_ATTEMPTS:8}
    chm-extractor: ${CHM_EXTRACTOR:7z}
    chm-max-entries: ${CHM_MAX_ENTRIES:20000}
    chm-max-expanded-bytes: ${CHM_MAX_EXPANDED_BYTES:268435456}
    chm-max-page-bytes: ${CHM_MAX_PAGE_BYTES:2097152}
    chm-max-listing-bytes: ${CHM_MAX_LISTING_BYTES:16777216}
    chunk-size: 1800
    chunk-overlap: 240
    embedding-model-id: ${EMBEDDING_MODEL:nomic-embed-text}
    embedding-dimensions: 768
  seed:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
