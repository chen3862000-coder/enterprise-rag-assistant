[project]
name = "enterprise-rag-python-backend"
version = "0.1.0"
description = "Independent Python implementation of the Enterprise RAG Assistant backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.135.2",
  "httpx==0.28.1",
  "pypdf==6.21.2",
  "pydantic-settings==2.11.0",
  "prometheus-client==0.23.1",
  "psycopg[binary]==3.2.10",
  "python-multipart==0.0.31",
  "sqlalchemy==2.0.44",
  "starlette==1.10.0",
  "tenacity==9.1.2",
  "uvicorn[standard]==0.38.0",
]

[dependency-groups]
dev = [
  "coverage[toml]==7.11.0",
  "mypy==1.18.2",
  "pip-audit==2.9.0",
  "pytest==9.0.3",
  "pytest-cov==7.0.0",
  "ruff==0.14.3",
  "testcontainers[postgres]==4.13.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --cov=app --cov-report=term-missing --cov-fail-under=70"
markers = ["integration: requires a real PostgreSQL/pgvector database"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pip-audit]
require-hashes = false
progress-spinner = false
